<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CITYVOICE — Админ-панель</title><link rel="stylesheet" href="/admin.css"></head><body><header><b>CITY<span>VOICE</span></b><div><span class="badge">ADMIN</span><button id="logout" class="ghost">Выйти</button></div></header><main><section id="login" class="panel login"><small>ЗАКРЫТАЯ ЗОНА</small><h1>Админ-панель</h1><p>Вход доступен только авторизованному администратору.</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Пароль администратора" required><button class="primary">Войти</button><div id="loginError" class="error"></div></form></section><section id="app" hidden><div class="top"><div><small>МОДЕРАЦИЯ</small><h1>Сообщения жителей</h1></div><div id="stats"></div></div><section class="filters"><input id="q" placeholder="Поиск по заголовку, описанию, адресу"><select id="status"><option value="">Все статусы</option><option value="new">Новые</option><option value="confirmed">Подтверждены</option><option value="sent">Переданы</option><option value="progress">В работе</option><option value="resolved">Решены</option><option value="rejected">Отклонены</option></select><button id="refresh">Обновить</button></section><div id="error" class="error"></div><section id="reports" class="grid"></section></section></main><script src="/admin.js"></script></body></html>
