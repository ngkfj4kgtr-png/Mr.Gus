<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><title>Mr.Gus</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="/styles.css"></head>
<body><div class="wrap"><header class="hero"><div><h1>🪿 Mr.Gus</h1><p class="muted">Миллион с нуля</p></div><div class="hero-badge">LIVE</div></header><div id="status" class="status" role="status">Запуск…</div><div class="stats"><div class="card stat"><small>Баланс</small><div class="v" id="balance">0 ₽</div></div><div class="card stat"><small>Уровень</small><div class="v" id="level">1</div></div><div class="card stat"><small>Доход</small><div class="v" id="income">0 ₽/ч</div></div></div><div class="card progress-card"><div class="section-head"><h2>Прогресс</h2><span id="xpText" class="muted">0 XP</span></div><div class="progress"><div id="xpBar" class="progress-fill"></div></div><div id="xpHint" class="muted"></div></div><div class="card"><div class="section-head"><h2>Бизнес</h2><span class="pill">Экономика</span></div><div id="business">Загрузка...</div></div><div class="card"><div class="section-head"><h2>Задания</h2><span class="pill">XP + ₽</span></div><div id="tasks"></div></div><div class="actions"><button class="btn" data-action="auth">Войти через Telegram</button><button class="btn secondary" data-action="refresh">Обновить</button></div></div><script src="/app.js" defer></script></body></html>
