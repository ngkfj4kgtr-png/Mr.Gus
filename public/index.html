<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><title>Mr.Gus</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0;background:#080a0f;color:#fff;font:16px system-ui}.wrap{max-width:700px;margin:auto;padding:24px}.card{background:#121720;border:1px solid #28303d;border-radius:16px;padding:18px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.v{font-size:22px;font-weight:800}.muted{color:#929baa}.btn{background:#6d63ff;color:#fff;border:0;border-radius:10px;padding:10px 14px;margin:4px;font-weight:700}</style></head>
<body><div class="wrap"><h1>🪿 Mr.Gus</h1><p class="muted">Миллион с нуля</p><div class="stats"><div class="card"><small>Баланс</small><div class="v" id="balance">0 ₽</div></div><div class="card"><small>Уровень</small><div class="v" id="level">1</div></div><div class="card"><small>Доход</small><div class="v" id="income">0 ₽/ч</div></div></div><div class="card"><h2>Бизнес</h2><div id="business">Загрузка...</div></div><div class="card"><h2>Задания</h2><div id="tasks"></div></div><button class="btn" onclick="auth()">Войти через Telegram</button><button class="btn" onclick="refresh()">Обновить</button></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const op=t=>t+"_"+crypto.randomUUID();const money=n=>new Intl.NumberFormat("ru-RU").format(Math.max(0,Math.floor(n)))+" ₽";
async function api(path,opt={}){const h={"Content-Type":"application/json",...(opt.headers||{})};if(tg?.initData)h["X-Telegram-Init-Data"]=tg.initData;const r=await fetch(path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||("HTTP "+r.status));return d}
async function auth(){try{await api("/api/auth/telegram",{method:"POST"});await refresh()}catch(e){alert(e.message)}}
async function refresh(){try{const s=await api("/api/state");render(s)}catch(e){alert(e.message)}}
function render(s){document.querySelector("#balance").textContent=money(s.balance);document.querySelector("#level").textContent=s.level;const b=s.businesses?.[0];document.querySelector("#income").textContent=money(b?.profitPerHour||0)+"/ч";document.querySelector("#business").innerHTML=b?"<b>Торговая точка</b><p>+"+money(b.profitPerHour)+"/час</p><button class='btn' onclick='collect()'>Забрать доход</button><button class='btn' onclick='upgrade()'>Улучшить</button>":"<p>Первая торговая точка — 1 000 ₽</p><button class='btn' onclick='buy()'>Открыть</button>";document.querySelector("#tasks").innerHTML=(s.tasks||[]).map(t=>"<div class='card'><b>"+t.title+"</b><p class='muted'>"+(t.description||"")+"</p><button class='btn' "+(t.claimed||t.locked?"disabled":"")+" onclick='claim("+JSON.stringify(t.id)+")'>"+(t.claimed?"Готово":t.locked?"🔒":"Забрать")+"</button></div>").join("")}
async function buy(){try{render(await api("/api/business/buy",{method:"POST",body:JSON.stringify({businessId:"kiosk",operationId:op("buy")})}))}catch(e){alert(e.message)}}async function upgrade(){try{render(await api("/api/business/upgrade",{method:"POST",body:JSON.stringify({businessId:"kiosk",operationId:op("upgrade")})}))}catch(e){alert(e.message)}}async function collect(){try{render(await api("/api/income/collect",{method:"POST",body:JSON.stringify({operationId:op("income")})}))}catch(e){alert(e.message)}}async function claim(id){try{render(await api("/api/task/claim",{method:"POST",body:JSON.stringify({taskId:id,operationId:op("task")})}))}catch(e){alert(e.message)}}refresh();
</script></body></html>
