<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CITYVOICE — Новая Майна</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""></head><body><header><b>CITY<span>VOICE</span></b><div class="city">📍 Новая Майна</div><button id="new">＋ Сообщить</button></header><main><section class="hero"><div><small>ГОРОД · ГОЛОС ЖИТЕЛЕЙ</small><h1>Проблемы города<br><i>должны быть видны.</i></h1><p>Сообщите о проблеме, поставьте точку на карте и дайте другим жителям подтвердить её.</p></div><strong id="count">0</strong></section><section class="filters"><input id="q" placeholder="Поиск"><select id="cat"><option value="">Все категории</option></select><select id="st"><option value="">Все статусы</option><option value="new">Новые</option><option value="confirmed">Подтверждены</option><option value="sent">Переданы</option><option value="progress">В работе</option><option value="resolved">Решены</option></select></section><section id="map"><div id="city-map"></div><div class="map-label">НОВАЯ МАЙНА · КАРТА ПРОБЛЕМ</div></section><div class="head"><h2>Последние сообщения</h2><button id="reload">Обновить</button></div><section id="list"></section></main><dialog id="dlg"><form id="form" method="dialog"><button type="button" id="close">×</button><h2>Сообщить о проблеме</h2><input name="title" required maxlength="100" placeholder="Что произошло?"><select name="category" id="fc" required></select><textarea name="description" required maxlength="1200" placeholder="Описание"></textarea><input name="address" maxlength="180" placeholder="Адрес или ориентир"><div class="two"><input name="lat" required type="number" step="any" placeholder="Широта"><input name="lng" required type="number" step="any" placeholder="Долгота"></div><input id="photo" type="file" accept="image/*"><img id="preview"><button class="primary" type="submit">Опубликовать</button><small>Имя публично не отображается.</small></form></dialog><div id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="/app.js"></script></body></html>
